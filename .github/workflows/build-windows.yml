name: Build & Release Windows EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version de la release (ex: v1.0.2)"
        required: true
        default: "v1.0.2"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name Cartegie_Mapper cartegie_cleaner.py

      - name: Keep artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: Cartegie-Mapper-Windows-${{ inputs.release_tag }}
          path: dist/Cartegie_Mapper.exe

      - name: Create or update GitHub Release and attach EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG" --target "${{ github.ref_name }}" --title "Cartegie Mapper $env:TAG" --notes "Build Windows Cartegie Mapper $env:TAG"
          }
          gh release upload "$env:TAG" "dist/Cartegie_Mapper.exe" --clobber
