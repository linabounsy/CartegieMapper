name: Release Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de la release (ex: v1.0.1)"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build executable
        run: pyinstaller --onefile --windowed --name Cartegie_Cleaner cartegie_cleaner.py

      - name: Create GitHub Release and attach EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$env:VERSION" "dist/Cartegie_Cleaner.exe" --title "Cartegie Cleaner $env:VERSION" --generate-notes --target "${{ github.sha }}"
